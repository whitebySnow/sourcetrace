name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql+asyncpg://sourcetrace:sourcetrace-ci-${{ github.run_id }}@localhost:5432/sourcetrace

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: sourcetrace
          POSTGRES_USER: sourcetrace
          POSTGRES_PASSWORD: sourcetrace-ci-${{ github.run_id }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sourcetrace -d sourcetrace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Verify CPU dependency contract
        run: python apps/api/scripts/verify_cpu_dependencies.py

      - name: Install Python dependencies
        run: uv sync --project apps/api --all-groups --extra cpu --frozen

      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated API contract
        run: |
          pnpm generate:api
          git diff --exit-code -- apps/web/openapi.json apps/web/src/shared/api/schema.d.ts

      - name: Verify database migrations
        run: uv run --project apps/api --extra cpu alembic -c apps/api/alembic.ini upgrade head

      - name: Static checks
        run: pnpm check

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build
