[project]
name = "sourcetrace-api"
version = "0.1.0"
description = "Traceable RAG knowledge base API and worker"
readme = "../../README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "dramatiq[redis]>=1.18,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "langgraph>=0.6,<1",
  "pgvector>=0.4,<1",
  "pydantic-settings>=2.10,<3",
  "pypdf>=6.0,<7",
  "python-multipart>=0.0.20,<1",
  "redis>=6.2,<7",
  "sentence-transformers>=5.1,<6",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "structlog>=25.4,<26",
  "tiktoken>=0.9,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
cpu = ["torch>=2.8,<3"]
cu130 = ["torch>=2.8,<3"]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu130" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sourcetrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["structlog.*"]
ignore_missing_imports = true
